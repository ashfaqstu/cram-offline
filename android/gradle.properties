# The build must not touch C:.
#
# This machine has ~15 GB free on D: and under 1 GB on C:. The JVM defaults its
# scratch space to the user temp directory on C:, and a Gradle daemon that runs
# out of room there does not fail cleanly - it vanishes mid-build with
# "Gradle build daemon disappeared unexpectedly", which reads like a crash and
# is really a full disk.
#
# Heap is 2 GB rather than 3: the native build (llama.cpp + whisper.cpp) runs
# alongside it, and this machine has 16 GB total with an IDE open.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djava.io.tmpdir=D:\\dev\\tmp
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
android.native.buildOutput=verbose
